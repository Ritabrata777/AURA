# Cloud broker configuration — unlike the local docker-compose broker, this
# one is reachable from the public internet, so it requires authentication.
# Credentials are injected via MQTT_USERNAME / MQTT_PASSWORD (see Dockerfile).
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# Bridge the websocket listener too, in case a browser-side tool ever needs it.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
